plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voicecleaner.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.voicecleaner.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure-Java LAME (MP3) port - no native code, all ABIs, API 21+
    implementation files('libs/jump3r-1.0.5.jar')
}
